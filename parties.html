<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TP Values — All Ideologies</title>
  <link rel="icon" type="image/png" href="tplogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f121a;
      --text: #e0e7ff;
      --card: #1e293b;
      --border: #334155;
      --accent: #ff8533;
      --logo-bg: #f8f9fc;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 5rem 1rem 4rem;
    }
    .brand-fixed {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15,18,26,0.7);
      padding: 8px 14px 8px 8px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
    }
    .brand-fixed img {
      width: 56px; height: 56px;
      border-radius: 10px;
      object-fit: cover;
    }
    .brand-text {
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: white;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 3rem;
      font-size: 1.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.6rem;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    }
    .card.expanded {
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    }
    .logo-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.2rem;
      background: var(--logo-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #334155;
    }
    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }
    .desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card.expanded .desc {
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 3.5rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .error {
      text-align: center;
      color: #f87171;
      margin-top: 3rem;
      font-size: 1.2rem;
    }
    .github-corner {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 10;
    }
    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out;
    }
    @keyframes octocat-wave {
      0%, 100% { transform: rotate(0); }
      20%, 60% { transform: rotate(-25deg); }
      40%, 80% { transform: rotate(10deg); }
    }
  </style>
</head>
<body>

  <a href="https://github.com/tpvalues/TPvalues" class="github-corner" target="_blank" rel="noopener noreferrer">
    <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
      <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
      <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
    </svg>
  </a>

  <div class="brand-fixed">
    <img src="tplogo.png" alt="TP Values">
    <span class="brand-text">TP Values</span>
  </div>

  <div class="container">
    <h1>All Ideologies</h1>
    <p class="subtitle">Every movement currently in the test</p>

    <div class="grid" id="grid"></div>
    <div id="error" class="error" style="display:none;"></div>

    <a href="index.html" class="back-link">← Back to the test</a>
  </div>

  <script src="ideologies.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const errorBox = document.getElementById("error");

    // Check if ideologies loaded
    if (typeof ideologies === "undefined" || !Array.isArray(ideologies)) {
      errorBox.style.display = "block";
      errorBox.textContent = "Error: ideologies.js did not load correctly. Make sure the file is in the same folder and named exactly \"ideologies.js\".";
    } else {
      const sorted = [...ideologies].sort((a, b) => a.name.localeCompare(b.name));

      sorted.forEach(ideo => {
        const card = document.createElement("div");
        card.className = "card";

        const logoBox = document.createElement("div");
        logoBox.className = "logo-box";

        const img = document.createElement("img");
        img.src = ideo.img || "";
        img.alt = ideo.name;
        img.onerror = () => {
          img.style.display = "none";
          logoBox.textContent = "?";
          logoBox.style.color = "#64748b";
          logoBox.style.fontSize = "2rem";
        };
        logoBox.appendChild(img);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = ideo.name;

        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = ideo.description || "";

        card.append(logoBox, name, desc);

        card.addEventListener("click", (e) => {
          e.stopPropagation();
          document.querySelectorAll(".card.expanded").forEach(c => {
            if (c !== card) c.classList.remove("expanded");
          });
          card.classList.toggle("expanded");
        });

        grid.appendChild(card);
      });
    }

    // Click outside to close
    document.addEventListener("click", () => {
      document.querySelectorAll(".card.expanded").forEach(c => c.classList.remove("expanded"));
    });
  </script>
</body>
</html>
