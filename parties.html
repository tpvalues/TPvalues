<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TP Values — All Ideologies</title>
  <link rel="icon" type="image/png" href="tplogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f121a;
      --text: #e0e7ff;
      --card: #1e293b;
      --border: #334155;
      --accent: #ff8533;
      --logo-bg: #f8f9fc;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 5rem 1rem 4rem;
    }
    .brand-fixed {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15,18,26,0.7);
      padding: 8px 14px 8px 8px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
    }
    .brand-fixed img {
      width: 56px; height: 56px;
      border-radius: 10px;
      object-fit: cover;
    }
    .brand-text {
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: white;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 3rem;
      font-size: 1.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.6rem;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    }
    .logo-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.2rem;
      background: var(--logo-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #334155;
    }
    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }
    .desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 3.5rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="brand-fixed">
    <img src="tplogo.png" alt="TP Values">
    <span class="brand-text">TP Values</span>
  </div>

  <div class="container">
    <h1>All Ideologies</h1>
    <p class="subtitle">Every movement currently in the test</p>

    <div class="grid" id="grid"></div>

    <a href="index.html" class="back-link">← Back to the test</a>
  </div>

  <script src="ideologies.js"></script>
  <script>
    const grid = document.getElementById("grid");

    // Sort alphabetically by name
    const sorted = [...ideologies].sort((a, b) => a.name.localeCompare(b.name));

    sorted.forEach(ideo => {
      const card = document.createElement("div");
      card.className = "card";

      const logoBox = document.createElement("div");
      logoBox.className = "logo-box";

      const img = document.createElement("img");
      img.src = ideo.img || "";
      img.alt = ideo.name;
      img.onerror = () => {
        img.style.display = "none";
        logoBox.textContent = "?";
        logoBox.style.color = "#64748b";
        logoBox.style.fontSize = "2rem";
      };
      logoBox.appendChild(img);

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = ideo.name;

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = ideo.description || "";

      card.append(logoBox, name, desc);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
